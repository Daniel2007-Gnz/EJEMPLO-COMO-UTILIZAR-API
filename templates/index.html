<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de Carros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --asphalt: #17191b;
        --panel: #212427;
        --panel-line: #34383c;
        --chrome: #c9ced3;
        --chrome-dim: #8b9095;
        --paper: #f2efe9;
        --ignition: #e8590c;
        --ignition-dim: #ba4809;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--asphalt);
        color: var(--chrome);
        font-family: 'Inter', sans-serif;
        line-height: 1.5;
    }

    .top-strip {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 6vw;
        border-bottom: 1px solid var(--panel-line);
        font-size: 13px;
        color: var(--chrome-dim);
        letter-spacing: 0.02em;
    }

    .top-strip strong {
        color: var(--paper);
        font-family: 'Oswald', sans-serif;
        font-size: 17px;
        letter-spacing: 0.04em;
    }

    header.hero {
        padding: 72px 6vw 56px;
        max-width: 720px;
    }

    .plate {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 2px solid var(--chrome-dim);
        border-radius: 4px;
        padding: 4px 12px;
        font-family: 'Oswald', sans-serif;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: var(--chrome-dim);
        margin-bottom: 28px;
    }

    .plate::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ignition);
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: clamp(34px, 5vw, 52px);
        line-height: 1.08;
        color: var(--paper);
        margin: 0 0 20px;
    }

    header.hero p {
        font-size: 17px;
        color: var(--chrome-dim);
        max-width: 46ch;
        margin: 0;
    }

    main {
        padding: 0 6vw 80px;
    }

    .inventory-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--panel-line);
        padding-bottom: 14px;
        margin-bottom: 4px;
    }

    .inventory-head h2 {
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: 20px;
        color: var(--paper);
        margin: 0;
    }

    .inventory-head-right {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    #contador {
        font-size: 13px;
        color: var(--chrome-dim);
    }

    #reiniciar-btn {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 500;
        padding: 6px 12px;
        background: transparent;
        color: var(--chrome-dim);
        border: 1px solid var(--panel-line);
        border-radius: 4px;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    #reiniciar-btn:hover {
        border-color: var(--ignition);
        color: var(--paper);
    }

    #carros {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .fila {
        display: grid;
        grid-template-columns: 96px 1.4fr 1fr auto auto;
        align-items: center;
        gap: 24px;
        padding: 22px 0;
        border-bottom: 1px solid var(--panel-line);
        transition: background 0.15s ease;
    }

    .fila:hover {
        background: rgba(232, 89, 12, 0.05);
    }

    .num {
        font-family: 'Oswald', sans-serif;
        font-size: 28px;
        color: var(--panel-line);
        font-weight: 600;
    }

    .info h3 {
        margin: 0 0 4px;
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: 19px;
        color: var(--paper);
    }

    .info span {
        font-size: 13px;
        color: var(--chrome-dim);
    }

    .specs {
        font-size: 13px;
        color: var(--chrome-dim);
    }

    .precio {
        font-family: 'Oswald', sans-serif;
        font-size: 20px;
        color: var(--ignition);
        white-space: nowrap;
        text-align: right;
    }

    .comprar-btn {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 16px;
        background: var(--ignition);
        color: var(--paper);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease;
    }

    .comprar-btn:hover {
        background: var(--ignition-dim);
    }

    .comprar-btn:disabled {
        background: var(--panel-line);
        color: var(--chrome-dim);
        cursor: not-allowed;
    }

    .estado-vacio, .estado-error {
        padding: 40px 0;
        color: var(--chrome-dim);
        font-size: 14px;
    }

    .estado-error {
        color: var(--ignition);
    }

    @media (max-width: 640px) {
        .fila {
            grid-template-columns: 40px 1fr;
            grid-template-areas:
                "num info"
                "num specs"
                "num precio"
                "num boton";
            row-gap: 6px;
        }
        .num { grid-area: num; font-size: 20px; }
        .info { grid-area: info; }
        .specs { grid-area: specs; }
        .precio { grid-area: precio; text-align: left; }
        .comprar-btn { grid-area: boton; width: fit-content; }
    }
</style>
</head>
<body>

    <div class="top-strip">
        <strong>RUTA 12 MOTORS</strong>
        <span>Inventario actualizado hoy</span>
    </div>

    <header class="hero">
        <div class="plate">STOCK DISPONIBLE</div>
        <h1>Encuentra el carro que sigue en tu camino.</h1>
        <p>Cada unidad pasó por revisión mecánica antes de entrar al lote. Precios en dólares, sin sorpresas al final.</p>
    </header>

    <main>
        <div class="inventory-head">
            <h2>Inventario</h2>
            <div class="inventory-head-right">
                <span id="contador">cargando…</span>
                <button id="reiniciar-btn">Reiniciar inventario</button>
            </div>
        </div>
        <ul id="carros"></ul>
    </main>

    <script>
        const lista = document.getElementById('carros');
        const contador = document.getElementById('contador');
        const reiniciarBtn = document.getElementById('reiniciar-btn');

        function actualizarContador() {
            const restantes = lista.querySelectorAll('.fila').length;
            contador.textContent = restantes + ' unidad' + (restantes === 1 ? '' : 'es');
        }

        function renderCarros(carros) {
            lista.innerHTML = '';

            if (!carros.length) {
                lista.innerHTML = '<li class="estado-vacio">Vendimos todo el inventario disponible.</li>';
                contador.textContent = '0 unidades';
                return;
            }

            contador.textContent = carros.length + ' unidad' + (carros.length === 1 ? '' : 'es');

            carros.forEach((carro, i) => {
                const fila = document.createElement('li');
                fila.className = 'fila';

                const num = String(i + 1).padStart(2, '0');
                const specs = [carro.anio, carro.kilometraje ? carro.kilometraje + ' km' : null, carro.transmision]
                    .filter(Boolean)
                    .join(' · ');

                fila.innerHTML = `
                    <span class="num">${num}</span>
                    <div class="info">
                        <h3>${carro.marca} ${carro.modelo}</h3>
                        <span>${carro.color || ''}</span>
                    </div>
                    <div class="specs">${specs}</div>
                    <div class="precio">$${Number(carro.precio).toLocaleString('es')}</div>
                    <button class="comprar-btn">Comprar</button>
                `;

                fila.querySelector('.comprar-btn').addEventListener('click', function () {
                    comprarCarro(carro.id, this);
                });

                lista.appendChild(fila);
            });
        }

        function cargarInventario() {
            fetch('/api/carros')
                .then(response => {
                    if (!response.ok) throw new Error('respuesta no válida');
                    return response.json();
                })
                .then(renderCarros)
                .catch(() => {
                    lista.innerHTML = '<li class="estado-error">No se pudo cargar el inventario. Intenta de nuevo en unos minutos.</li>';
                    contador.textContent = '';
                });
        }

        function comprarCarro(id, boton) {
            boton.disabled = true;
            boton.textContent = 'Procesando…';

            fetch(`/api/carros/${id}/comprar`, { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('no se pudo comprar');
                    return response.json();
                })
                .then(() => {
                    const fila = boton.closest('.fila');
                    fila.style.transition = 'opacity 0.25s ease';
                    fila.style.opacity = '0';
                    setTimeout(() => {
                        fila.remove();
                        actualizarContador();
                        if (!lista.querySelector('.fila')) {
                            lista.innerHTML = '<li class="estado-vacio">Vendimos todo el inventario disponible.</li>';
                        }
                    }, 250);
                })
                .catch(() => {
                    boton.disabled = false;
                    boton.textContent = 'Comprar';
                    alert('No se pudo completar la compra. Intenta de nuevo.');
                });
        }

        reiniciarBtn.addEventListener('click', function () {
            reiniciarBtn.disabled = true;
            reiniciarBtn.textContent = 'Reiniciando…';

            fetch('/api/carros/reiniciar', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('no se pudo reiniciar');
                    return response.json();
                })
                .then(carros => {
                    renderCarros(carros);
                    reiniciarBtn.disabled = false;
                    reiniciarBtn.textContent = 'Reiniciar inventario';
                })
                .catch(() => {
                    reiniciarBtn.disabled = false;
                    reiniciarBtn.textContent = 'Reiniciar inventario';
                    alert('No se pudo reiniciar el inventario. Intenta de nuevo.');
                });
        });

        cargarInventario();
    </script>

</body>
</html>
